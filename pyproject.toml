[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unlearn-bench"
version = "0.1.0"
description = "A reproducible benchmark for controlled language-model unlearning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "torch>=2.2"]

[project.optional-dependencies]
hf = ["transformers==4.51.3", "accelerate>=0.30"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
